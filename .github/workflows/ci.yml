name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite, pcntl, posix, redis, pgsql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Static analysis (framework and example)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: JOSE interoperability tooling (jwcrypto)
        run: pip install --user jwcrypto
      - name: Tests
        run: vendor/bin/phpunit
      - name: Static analysis (generated code)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress -c phpstan.neon.dist examples/shop/var/build/test examples/fix-gateway/var/build/test
      - name: Production build and checks
        working-directory: examples/shop
        env:
          METRICS_TOKEN: ci
        run: |
          php ../../bin/keel build --env=prod
          APP_KEY=$(php ../../bin/keel key:generate) php ../../bin/keel check --env=prod
      - name: Kernel benchmark
        run: php -d opcache.enable_cli=1 benchmarks/kernel.php | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-php${{ matrix.php }}
          path: benchmark.txt

  databases:
    # The database-backed tests on real PostgreSQL (PDO and the non-blocking driver) and MySQL,
    # and the server and queue tests with Redis.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            dsn: 'pgsql:host=127.0.0.1;port=5432;dbname=keel_test;user=keel;password=keel'
          - db: postgres-async
            dsn: 'pgsql-async:host=127.0.0.1;port=5432;dbname=keel_test;user=keel;password=keel'
          - db: mysql
            dsn: 'mysql:host=127.0.0.1;port=3306;dbname=keel_test;user=root;password=keel'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U keel" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: keel
          MYSQL_DATABASE: keel_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pkeel" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, pcntl, posix, redis
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Tests on ${{ matrix.db }}
        env:
          KEEL_TEST_DATABASE_DSN: ${{ matrix.dsn }}
          KEEL_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=keel_test;user=keel;password=keel'
          KEEL_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: vendor/bin/phpunit tests/Http tests/Auth tests/Queue tests/Orm tests/Database tests/Server tests/Crypto tests/Ledger tests/Service

  brokers:
    # The queue transports against real RabbitMQ and an SQS-compatible server.
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.9
        ports: ['9324:9324']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_sqlite, pcntl, redis, sockets
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Transport tests
        env:
          KEEL_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
          KEEL_TEST_SQS_ENDPOINT: http://127.0.0.1:9324/
          KEEL_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: vendor/bin/phpunit tests/Queue/TransportTest.php

  nosql:
    # The non-relational drivers against real servers: the DocumentStore contract on each, and
    # the MongoDB wire protocol (with SCRAM-SHA-256 authentication).
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: keel
          MONGO_INITDB_ROOT_PASSWORD: keel-secret
        ports: ['27017:27017']
      dynamodb:
        image: amazon/dynamodb-local
        ports: ['8000:8000']
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 5s --health-timeout 5s --health-retries 30
      couchdb:
        image: couchdb:3.4
        env:
          COUCHDB_USER: keel
          COUCHDB_PASSWORD: keel-secret
        ports: ['5984:5984']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: NoSQL tests
        env:
          KEEL_TEST_MONGODB_URL: mongodb://keel:keel-secret@127.0.0.1:27017/keel_test?authSource=admin
          KEEL_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          KEEL_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9200
          KEEL_TEST_COUCHDB_URL: http://keel:keel-secret@127.0.0.1:5984
        run: vendor/bin/phpunit tests/NoSql

  vector-extension:
    # The keel_vector extension: Rust tests at every SIMD level the runner has, clippy, then the PHP
    # contract and property suites with the pure-PHP implementation and with the extension, and the
    # whole test suite with the extension loaded.
    name: vector extension (${{ matrix.os }}, PHP ${{ matrix.php }}${{ matrix.ts == 'ts' && ' ZTS' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.3' }
          - { os: ubuntu-latest, php: '8.4' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: ubuntu-latest, php: '8.4', ts: ts }
          - { os: ubuntu-24.04-arm, php: '8.3' }
          - { os: ubuntu-24.04-arm, php: '8.4' }
          - { os: ubuntu-24.04-arm, php: '8.5' }
          - { os: macos-latest, php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
        env:
          phpts: ${{ matrix.ts || 'nts' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/keel_vector
      - run: composer install --no-interaction --no-progress
      - name: Rust tests (debug and release)
        run: make -C ext/keel_vector test
      - name: Clippy
        working-directory: ext/keel_vector
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: ext/keel_vector/build.sh
      - name: Vector suites, pure-PHP implementation then the extension
        run: make -C ext/keel_vector test-php
      - name: Whole test suite with the extension
        run: php -d extension=$PWD/ext/keel_vector/target/release/keel_vector.so vendor/bin/phpunit

  vector-valgrind:
    # The vector suites with the extension under valgrind: no invalid reads or writes, no use of
    # uninitialised memory, no leaks through the extension.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/keel_vector
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: composer install --no-interaction --no-progress
      - name: Vector suites under valgrind
        run: make -C ext/keel_vector valgrind
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-log
          path: ext/keel_vector/target/valgrind.log

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt && mkdocs build --strict
